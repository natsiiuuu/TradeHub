<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub - Daftar Barang</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!--Navbar-->
    <nav class="navbar navbar-expand-md navbar-dark bg-tradehub">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                TradeHub
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuUtama"
                aria-controls="menuUtama"
                aria-expanded="false"
                aria-label="Buka menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="daftar-barang.html">
                            Daftar Barang
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah-barang.html">
                            Jual Barang
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container my-4">

            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
                <div>
                    <h2 class="text-tradehub fw-bold mb-0">
                        Daftar Barang
                    </h2>

                    <small class="text-muted" id="product-count" aria-live="polite">
                        Menampilkan 5 barang
                    </small>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="urutkan" class="small text-muted mb-0">
                        Urutkan:
                    </label>

                    <select
                        id="urutkan"
                        class="form-select form-select-sm w-auto"
                    >
                        <option value="terbaru">Terbaru</option>
                        <option value="termurah">Harga Terendah</option>
                        <option value="termahal">Harga Tertinggi</option>
                    </select>
                </div>
            </div>

            <!-- Filter barang -->
            <form id="filter-form" class="row g-2 mb-4">

                <div class="col-12 col-md-5">
                    <input
                        type="search"
                        class="form-control"
                        name="search"
                        id="search"
                        placeholder="Cari nama barang"
                    >
                </div>

                <div class="col-6 col-md-3">
                    <select class="form-control" name="kategori" id="category-filter">
                        <option value="">
                            Semua Kategori
                        </option>
                        <option value="Buku">
                            Buku
                        </option>
                        <option value="Elektronik">
                            Elektronik
                        </option>
                        <option value="Fashion">
                            Fashion
                        </option>
                    </select>
                </div>

                <div class="col-6 col-md-2">
                    <select class="form-control" name="status" id="status-filter">
                        <option value="">
                            Semua Status
                        </option>
                        <option value="tersedia">
                            Tersedia
                        </option>
                        <option value="dipesan">
                            Dipesan
                        </option>
                        <option value="terjual">
                            Terjual
                        </option>
                    </select>
                </div>

                <div class="col-12 col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Cari
                    </button>
                </div>

            </form>

            <!--Produk diisi dari array dummy menggunakan JavaScript-->
            <div id="product-container" class="row g-3"></div>

        </div>
    </main>

    <footer class="bg-tradehub text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; 2026 TradeHub - Forum Jual Beli Mahasiswa
        </p>
    </footer>

    <!-- Bootstrap JS (CDN) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
