<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub - Jual Barang</title>

    <!-- Bootstrap CSS (CDN) -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Navbar responsif: collapse di mobile -->
    <nav class="navbar navbar-expand-md navbar-dark bg-tradehub">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                TradeHub
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuUtama"
                aria-controls="menuUtama"
                aria-expanded="false"
                aria-label="Buka menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="daftar-barang.html">
                            Daftar Barang
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah-barang.html">
                            Jual Barang
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <main>
        <div class="container my-4">

            <h2 class="text-tradehub fw-bold">
                Jual Barang
            </h2>

            <p>
                Isi informasi barang yang ingin kamu jual.
            </p>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form action="#" method="post">

                        <div class="row mb-3">
                            <label
                                for="nama-barang"
                                class="col-sm-3 col-form-label"
                            >
                                Nama Barang:
                            </label>

                            <div class="col-sm-9">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nama-barang"
                                    name="nama-barang"
                                    placeholder="Contoh: Kalkulator Casio"
                                    required
                                >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="kategori"
                                class="col-sm-3 col-form-label"
                            >
                                Kategori:
                            </label>

                            <div class="col-sm-9">
                                <select
                                    class="form-control"
                                    id="kategori"
                                    name="kategori"
                                    required
                                >
                                    <option value="">
                                        Pilih Kategori
                                    </option>
                                    <option value="akademik">
                                        Akademik
                                    </option>
                                    <option value="elektronik">
                                        Elektronik
                                    </option>
                                    <option value="fashion">
                                        Fashion
                                    </option>
                                    <option value="kos">
                                        Kos
                                    </option>
                                    <option value="olahraga">
                                        Olahraga
                                    </option>
                                    <option value="lainnya">
                                        Lainnya
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="kondisi"
                                class="col-sm-3 col-form-label"
                            >
                                Kondisi:
                            </label>

                            <div class="col-sm-9">
                                <select
                                    class="form-control"
                                    id="kondisi"
                                    name="kondisi"
                                    required
                                >
                                    <option value="">
                                        Pilih Kondisi
                                    </option>
                                    <option value="seperti baru">
                                        Seperti Baru
                                    </option>
                                    <option value="sangat baik">
                                        Sangat Baik
                                    </option>
                                    <option value="baik">
                                        Baik
                                    </option>
                                    <option value="cukup">
                                        Cukup
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="harga"
                                class="col-sm-3 col-form-label"
                            >
                                Harga (Rp):
                            </label>

                            <div class="col-sm-9">
                                <input
                                    type="number"
                                    class="form-control"
                                    id="harga"
                                    name="harga"
                                    placeholder="Contoh: 80000"
                                    required
                                >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="lokasi"
                                class="col-sm-3 col-form-label"
                            >
                                Lokasi:
                            </label>

                            <div class="col-sm-9">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="lokasi"
                                    name="lokasi"
                                    placeholder="Contoh: Telkom University"
                                    required
                                >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="status"
                                class="col-sm-3 col-form-label"
                            >
                                Status:
                            </label>

                            <div class="col-sm-9">
                                <select
                                    class="form-control"
                                    id="status"
                                    name="status"
                                    required
                                >
                                    <option value="">
                                        Pilih Status
                                    </option>
                                    <option value="tersedia">
                                        Tersedia
                                    </option>
                                    <option value="dipesan">
                                        Dipesan
                                    </option>
                                    <option value="terjual">
                                        Terjual
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="foto"
                                class="col-sm-3 col-form-label"
                            >
                                Foto Barang:
                            </label>

                            <div class="col-sm-9">
                                <input
                                    type="file"
                                    class="form-control"
                                    id="foto"
                                    name="foto"
                                    accept="image/*"
                                    required
                                >
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label
                                for="deskripsi"
                                class="col-sm-3 col-form-label"
                            >
                                Deskripsi:
                            </label>

                            <div class="col-sm-9">
                                <textarea
                                    class="form-control"
                                    id="deskripsi"
                                    name="deskripsi"
                                    rows="5"
                                    placeholder="Jelaskan kondisi barang..."
                                    required
                                ></textarea>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-9 offset-sm-3">

                                <button
                                    type="submit"
                                    class="btn btn-success"
                                >
                                    Publikasikan
                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-secondary"
                                >
                                    Reset
                                </button>

                            </div>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </main>

    <footer class="bg-tradehub text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; 2026 TradeHub - Forum Jual Beli Mahasiswa
        </p>
    </footer>

    <!-- Bootstrap JS (CDN) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

</body>
</html>
