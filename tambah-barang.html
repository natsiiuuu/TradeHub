<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub - Jual Barang</title>
</head>

<body>

    <header>
        <h1>TradeHub</h1>
        <p>Forum jual beli barang antar mahasiswa.</p>

        <nav>
            <a href="index.html">Beranda</a>
            <a href="tambah-barang.html">Jual Barang</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Jual Barang</h2>

            <p>
                Isi informasi barang yang ingin kamu jual.
            </p>

            <form action="#" method="post">

                <p>
                    <label for="nama-barang">
                        Nama Barang:
                    </label>

                    <input
                        type="text"
                        id="nama-barang"
                        name="nama-barang"
                        placeholder="Contoh: Kalkulator Casio"
                        required
                    >
                </p>

                <p>
                    <label for="kategori">
                        Kategori:
                    </label>

                    <select
                        id="kategori"
                        name="kategori"
                        required
                    >
                        <option value="">
                            Pilih Kategori
                        </option>
                        <option value="akademik">
                            Akademik
                        </option>
                        <option value="elektronik">
                            Elektronik
                        </option>
                        <option value="fashion">
                            Fashion
                        </option>
                        <option value="kos">
                            Peralatan Kos
                        </option>
                        <option value="olahraga">
                            Olahraga
                        </option>
                        <option value="lainnya">
                            Lainnya
                        </option>
                    </select>
                </p>

                <p>
                    <label for="kondisi">
                        Kondisi Barang:
                    </label>

                    <select
                        id="kondisi"
                        name="kondisi"
                        required
                    >
                        <option value="">
                            Pilih Kondisi
                        </option>
                        <option value="seperti-baru">
                            Seperti Baru
                        </option>
                        <option value="sangat-baik">
                            Sangat Baik
                        </option>
                        <option value="baik">
                            Baik
                        </option>
                        <option value="cukup">
                            Cukup
                        </option>
                    </select>
                </p>

                <p>
                    <label for="harga">
                        Harga:
                    </label>

                    <input
                        type="number"
                        id="harga"
                        name="harga"
                        placeholder="Contoh: 80000"
                        min="0"
                        required
                    >
                </p>

                <p>
                    <label for="lokasi">
                        Lokasi Barang:
                    </label>

                    <input
                        type="text"
                        id="lokasi"
                        name="lokasi"
                        placeholder="Contoh: Telkom University"
                        required
                    >
                </p>

                <p>
                    <label for="status">
                        Status Barang:
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >
                        <option value="tersedia">
                            Tersedia
                        </option>
                        <option value="dipesan">
                            Dipesan
                        </option>
                        <option value="terjual">
                            Terjual
                        </option>
                    </select>
                </p>

                <p>
                    <label for="foto">
                        Foto Barang:
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                        required
                    >
                </p>

                <p>
                    <label for="deskripsi">
                        Deskripsi Barang:
                    </label>
                </p>

                <p>
                    <textarea
                        id="deskripsi"
                        name="deskripsi"
                        rows="6"
                        cols="50"
                        placeholder="Jelaskan kondisi dan informasi barang..."
                        required
                    ></textarea>
                </p>

                <button type="submit">
                    Publikasikan Barang
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 TradeHub - Forum Jual Beli Mahasiswa
        </p>
    </footer>

</body>
</html>
